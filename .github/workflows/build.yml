name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xem cau truc repo
        run: ls -R | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "KHONG TIM THAY build.gradle - chua upload file mod"; exit 1; fi
          cd "$(dirname "$F")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: lananh-quickjoin
          path: "**/build/libs/*.jar"
