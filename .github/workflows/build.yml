name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Giai nen va build
        run: |
          Z=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
          if [ -z "$Z" ]; then echo "CHUA UPLOAD FILE ZIP"; exit 1; fi
          mkdir -p /tmp/mod
          unzip -q "$Z" -d /tmp/mod
          F=$(find /tmp/mod -name build.gradle | head -n1)
          cd "$(dirname "$F")"
          gradle build
          mkdir -p $GITHUB_WORKSPACE/out
          cp build/libs/*.jar $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: lananh-quickjoin
          path: out/*.jar
